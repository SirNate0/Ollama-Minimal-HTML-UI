<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./logo.png" />
    <title>Ollama HTML UI</title>
    <link href="./custom.css" rel="stylesheet" />
  </head>
  <body>
    <h1>Ask a Question</h1>
    <main>
      <div id="chat-container">
        <div id="history"></div>
        <div id="current-response" class="history assistant working"></div>
      </div>

      <div id="form-container">
        <form id="settings-form" >
        <div id="error-container"></div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="text" id="ip-address" placeholder="Enter IP Address" style="flex: 100;" />
          <button type="submit" id="refresh-button" title="Refresh Models" style="flex:1">⟳</button>
          <!-- 🗘 causes the line height to be much too large -->
          <select id="model-name" style="flex: 20;">
            <option selected disabled>No model</option>
          </select>
          <!-- <input type="text" id="model-name" placeholder="Model Name" style="flex: 4;" /> -->
        </div>
        </form>
        <form id="question-form">
        <textarea
          rows="4"
          cols="50"
          placeholder="Enter your question here"
          id="user-chat"
        ></textarea>
        <div style="display:flex; gap:8px; margin-top:8px">
          <button type="submit" id="submit-button">Submit</button>
          <button type="button" id="continue-button">Continue</button>
          <button type="button" id="stop-button">Stop</button>
          <button type="button" id="export-button">Export JSON</button>
          <button type="button" id="import-button">Import JSON</button>
          <button type="button" id="clear-button">Clear</button>
        </div>
        <input id="import-file" type="file" accept="application/json" style="display:none" />
      </form>
      </div>
    </main>

    <!-- Load required 3rd-party scripts -->
<!--     <script type="module" src="./external/markdown-it.js"></script> -->
<!--     <script type="module" src="./external/markdown-it-katex.js"></script> -->
 
<!--   <script src="./external/markdown-it-mathjax3.js" /> -->
    <script src="./external/highlight/highlight.min.js"></script>
    <link href="./external/highlight/theme.css" rel="stylesheet" />
    <link rel="stylesheet" href="./external/katex.min.css" />

    <!-- Load application scripts -->
<!--     <script type="module" src="./markdownit-setup.js" defer></script> -->
<!--     <script src="./external/markdown-it-setup.js"></script> -->
  <!-- markdown-it loaded locally for offline use -->
  <script src="./external/markdown-it.min.js"></script>

  <!-- Load jsonurl to produce compact JSON URL fragments (falls back to JSON if unavailable) -->
  <script src="./external/jsonurl.min.js"></script>

  <!-- Load KaTeX and the official @mdit/plugin-katex browser build locally -->
  <script src="./external/katex.min.js"></script>

  <script type="module">
    import { katex } from './external/plugin-katex-browser.js'; // Official plugin (local)
    // If you want mhchem support, uncomment the line below:
    // import './lib/mhchem-browser.js';

    // markdownIt is global from CDN
    const markdown = window.markdownit({
  highlight: function (str, lang) {
    if (lang && hljs.getLanguage(lang)) {
      try {
        return (
          '<pre><code class="hljs">' +
          hljs.highlight(str, { language: lang, ignoreIllegals: true }).value +
          "</code></pre>"
        );
      } catch (__) {}
    }

    return (
      '<pre><code class="hljs">' +
      markdown.utils.escapeHtml(str) +
      "</code></pre>"
    );
  },
}).use(katex, {delimiters:"all"});
  window.markdown = markdown;
  </script>
    <script src="./chat-history.js"></script>
    <script src="./chat.js"></script>
    <script src="./persist.js"></script>
    <script src="./handle-model.js"></script>
  </body>
</html>
