<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./logo.png" />
    <title>Ollama HTML UI</title>
    <link href="./custom.css" rel="stylesheet" />
  </head>
  <body>
    <h1>Ask a Question</h1>
    <main>
      <div id="history"></div>
      <div id="current-response" class="history assistant working"></div>

      <div id="error-container"></div>
      <form id="question-form">
        <div style="display: flex">
          <input type="text" id="ip-address" placeholder="Enter IP Address" />
          <select id="model-dropdown">
            <option selected disabled>No model</option>
          </select>
        </div>
        <input type="text" id="model-name" placeholder="Enter Model Name" />
        <textarea
          rows="4"
          cols="50"
          placeholder="Enter your question here"
          id="user-chat"
        ></textarea>
        <button type="submit" id="submit-button">Submit</button>
      </form>
    </main>

    <!-- Load required 3rd-party scripts -->
<!--     <script type="module" src="./external/markdown-it.js"></script> -->
<!--     <script type="module" src="./external/markdown-it-katex.js"></script> -->
<!-- <script type="module"> import markdownItKatex from 'https://cdn.jsdelivr.net/npm/markdown-it-katex@2.0.3/+esm'; window.markdownItKatex=markdownItKatex; </script> -->
<!--   <script src="./external/markdown-it-mathjax3.js" /> -->
    <script src="./external/highlight/highlight.min.js"></script>
    <link href="./external/highlight/theme.css" rel="stylesheet" />
    <link rel="stylesheet" href="./external/katex.min.css" />

    <!-- Load application scripts -->
<!--     <script type="module" src="./markdownit-setup.js" defer></script> -->
<!--     <script src="./external/markdown-it-setup.js"></script> -->
  <!-- markdown-it via CDN (for demo; you can also host locally) -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>
  
  <!-- Now load the plugin via ES Modules from your local lib/ directory -->
  <script type="module">
    import { katex } from 'https://cdn.jsdelivr.net/npm/@mdit/plugin-katex/lib/browser.js'; // Main browser entry for the plugin
    // If you want mhchem support, uncomment the line below:
    // import './lib/mhchem-browser.js';

    // markdownIt is global from CDN
    const markdown = window.markdownit({
  highlight: function (str, lang) {
    if (lang && hljs.getLanguage(lang)) {
      try {
        return (
          '<pre><code class="hljs">' +
          hljs.highlight(str, { language: lang, ignoreIllegals: true }).value +
          "</code></pre>"
        );
      } catch (__) {}
    }

    return (
      '<pre><code class="hljs">' +
      markdown.utils.escapeHtml(str) +
      "</code></pre>"
    );
  },
}).use(katex, {delimiters:"all"});
  window.markdown = markdown;
  </script>
    <script src="./chat-history.js"></script>
    <script src="./chat.js"></script>
    <script src="./persist.js"></script>
    <script src="./handle-model.js"></script>
  </body>
</html>
